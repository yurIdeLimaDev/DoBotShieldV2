name: dobotwaf

services:
  waf:
    build:
      context: .
      dockerfile: Dockerfile
    image: dobotwaf:local
    init: true
    restart: unless-stopped
    ports:
      - "${WAF_PORT:-8080}:8080"
    environment:
      TARGET_URL: "${TARGET_URL:?Copy .env.example to .env and set TARGET_URL}"
      HTTP_MODE: "true"
      PROXY_PORT: ":8080"
      ENABLE_WAF: "true"
      WAF_MODE: "${WAF_MODE:-block}"
      ENABLE_RATE_LIMIT: "true"
      ENABLE_RESPONSE_INSPECTION: "true"
      ENABLE_WEBSOCKET_PROTECTION: "true"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1,::1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
